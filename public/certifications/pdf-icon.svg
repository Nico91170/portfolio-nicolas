<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436" />
      <stop offset="100%" stop-color="#1e2324" />
    </linearGradient>
    <linearGradient id="certPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84393" />
      <stop offset="100%" stop-color="#fd79a8" />
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e84393" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect x="6" y="6" width="108" height="108" rx="20" fill="url(#certBg)" stroke="#e84393" stroke-width="2" stroke-opacity="0.4" filter="url(#pinkGlow)"/>
  
  <!-- Document Folded Corner -->
  <path d="M36 28 H72 L84 40 V90 H36 Z" fill="#2d3436" stroke="#b2bec3" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72 28 V40 H84" fill="#1e2324" stroke="#b2bec3" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- PDF Badge -->
  <rect x="42" y="52" width="36" height="18" rx="4" fill="url(#certPink)"/>
  <text x="60" y="65" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="1">PDF</text>
  
  <!-- Decorative lines -->
  <line x1="44" y1="76" x2="76" y2="76" stroke="#b2bec3" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="44" y1="82" x2="68" y2="82" stroke="#b2bec3" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
