<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Non Trouvée | Portfolio Nicolas Pires De Jesus</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #2d3436;
      --card-bg: rgba(30, 35, 36, 0.9);
      --border: rgba(178, 190, 195, 0.25);
      --gradient: linear-gradient(135deg, #e84393 0%, #fd79a8 50%, #b2bec3 100%);
      --text: #dfe6e9;
      --text-muted: #b2bec3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow */
    .glow-1 {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(232, 67, 147, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      bottom: 20%;
      right: 20%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(253, 121, 168, 0.12) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .status-code {
      font-size: 6.5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      background: var(--gradient);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 15px -3px rgba(232, 67, 147, 0.35);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 20px 25px -5px rgba(232, 67, 147, 0.5);
    }

    .btn svg {
      margin-right: 0.5rem;
      width: 1.25rem;
      height: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="card">
    <div class="status-code">404</div>
    <h1>Page non trouvée</h1>
    <p>Oups ! La ressource que vous recherchez semble avoir été déplacée, supprimée ou n'a jamais existé.</p>
    <a href="/" class="btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Retour à l'accueil
    </a>
  </main>
</body>
</html>
