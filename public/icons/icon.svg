<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84393" />
      <stop offset="50%" stop-color="#fd79a8" />
      <stop offset="100%" stop-color="#e84393" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436" />
      <stop offset="100%" stop-color="#1e2324" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="100" height="100" rx="24" fill="url(#bgGradient)" stroke="#b2bec3" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Monogram NP -->
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="url(#brandGradient)" text-anchor="middle" letter-spacing="-1">
    NP
  </text>
</svg>
